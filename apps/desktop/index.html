<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Sirius</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#ebe3d1" />
    <!-- Paint the ground colour before any CSS loads, so launch never flashes white. -->
    <style>
      html { background: #ebe3d1; }
      html[data-theme] { background: var(--bg); }
    </style>
    <!-- The last theme's ground, so the first frame is already in it, not in Paper's beige. -->
    <script>
      try {
        const ground = localStorage.getItem('sirius.ground');
        const theme = localStorage.getItem('sirius.theme');
        if (/^[a-z-]+$/.test(theme) && theme !== 'paper') document.documentElement.dataset.theme = theme;
        if (/^#[0-9a-f]{6}$/i.test(ground)) {
          document.documentElement.style.background = ground;
          document.querySelector('meta[name="theme-color"]').content = ground;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
