[project]
name = "sirius-voice"
version = "0.1.0"
description = "Local push-to-talk voice for Sirius"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faster-whisper>=1.2,<2",
  "httpx>=0.27,<1",
  "numpy>=1.26",
  "piper-tts>=1.8,<2",
]

[project.scripts]
sirius-voice = "sirius_voice.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# CUDA libraries for Whisper on an NVIDIA GPU, kept in the venv so no system install is needed.
gpu = ["nvidia-cublas-cu12>=12.4", "nvidia-cudnn-cu12>=9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sirius_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
