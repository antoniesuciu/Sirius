<title>Sirius — logo motion playground</title>

<style>
  :root { --bg:#ebe3d1; --panel:#f4eee1; --fg:#1a1814; --muted:#5f5849; }
  body { --line:color-mix(in srgb, var(--fg) 14%, transparent); --chip:var(--panel); --chip-on:var(--fg); --chip-on-fg:var(--bg); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); font-family:Inter, system-ui, sans-serif; font-size:14px;
         display:flex; flex-direction:column; align-items:center; transition:background .4s, color .4s; }
  header { width:min(920px, 100%); padding:22px 20px 0; display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { font-family:Newsreader, Georgia, serif; font-weight:500; font-size:24px; margin:0; letter-spacing:.2px; }
  .sub { color:var(--muted); }
  .stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:360px; width:100%; padding:8px 0; }
  #logo { width:min(58vmin, 440px); height:auto; overflow:visible; }
  #caption { font-family:Newsreader, Georgia, serif; font-size:20px; margin-top:10px; min-height:28px; }
  #desc { color:var(--muted); max-width:560px; text-align:center; min-height:40px; padding:0 16px; line-height:1.45; }
  .controls { width:min(920px, 100%); padding:0 20px 24px; display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; }
  button, .file { font:inherit; border:1px solid var(--line); background:var(--chip); color:var(--fg); padding:7px 13px;
                  border-radius:999px; cursor:pointer; transition:background .2s, color .2s; }
  button:hover, .file:hover { border-color:var(--muted); }
  button.on { background:var(--chip-on); color:var(--chip-on-fg); border-color:var(--chip-on); }
  button kbd { font-family:inherit; opacity:.5; margin-left:6px; font-size:12px; }
  .label { color:var(--muted); margin-right:4px; }
  .file input { display:none; }
  .note { color:var(--muted); font-size:12px; text-align:center; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const S = { cx: 255.0, cy: 264.5, R: 193.2, sx: 369.3, sy: 141.0, px: 255.0, py: 380.4 };
  const q = id => document.getElementById(id);
  const mark = q('mark'), ringG = q('ringG'), wolf = q('wolf'), ear = q('ear-back'), eye = q('eye'),
        starG = q('starG'), star = q('star'), glow = q('starGlow'), glint = q('glint'),
        constel = q('constel'), ripple = q('ripple'), reveal = q('reveal'), grad = q('sirius-grad');
  const R = gsap.utils.random;
  gsap.defaults({ overwrite: 'auto' });

  // ---- pivots -------------------------------------------------------------
  gsap.set(ringG, { svgOrigin: `${S.cx} ${S.cy}` });
  gsap.set(wolf, { svgOrigin: `${S.px} ${S.py}` });
  gsap.set([starG, star, glow], { svgOrigin: `${S.sx} ${S.sy}` });
  gsap.set(eye, { transformOrigin: '50% 100%' });
  gsap.set(ear, { transformOrigin: '25% 100%' });

  // ---- gradient rotation (userSpaceOnUse: rotate the field, not the shapes) --
  const G = { x1: 213.3, y1: 75.0, x2: 214.6, y2: 458.2 };
  const gm = { x: (G.x1 + G.x2) / 2, y: (G.y1 + G.y2) / 2 }, gv = { x: (G.x2 - G.x1) / 2, y: (G.y2 - G.y1) / 2 };
  const gp = { a: 0 };
  function applyGrad() {
    const t = gp.a * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
    const vx = gv.x * c - gv.y * s, vy = gv.x * s + gv.y * c;
    grad.setAttribute('x1', gm.x - vx); grad.setAttribute('y1', gm.y - vy);
    grad.setAttribute('x2', gm.x + vx); grad.setAttribute('y2', gm.y + vy);
  }

  // ---- moonlight glint, clipped to the ring --------------------------------
  const gl = { a: 200 }, glR = S.R - 17;
  function applyGlint() {
    const t = gl.a * Math.PI / 180;
    glint.setAttribute('cx', S.cx + glR * Math.cos(t));
    glint.setAttribute('cy', S.cy + glR * Math.sin(t));
  }
  applyGlint();

  // ---- Canis Major, anchored on the star (Sirius = alpha CMa) ----------------
  const NS = 'http://www.w3.org/2000/svg';
  const P = { alpha: [0, 0], theta: [-6, -34], beta: [34, -20], o2: [18, 34], delta: [40, 62],
              eps: [70, 80], eta: [20, 96], zeta: [88, 40] };
  const EDGES = [['alpha', 'theta'], ['alpha', 'beta'], ['alpha', 'o2'], ['o2', 'delta'],
                 ['delta', 'eps'], ['delta', 'eta'], ['eps', 'zeta']];
  const CS = 1.35;  // constellation scale
  const pos = k => [S.sx + CS * P[k][0], S.sy + CS * P[k][1]];
  const lines = [], lens = [], dots = {};
  EDGES.forEach(([a, b]) => {
    const [x1, y1] = pos(a), [x2, y2] = pos(b);
    const l = document.createElementNS(NS, 'line');
    Object.entries({ x1, y1, x2, y2, stroke: 'url(#sirius-grad)', 'stroke-width': 1.5,
                     'stroke-linecap': 'round', fill: 'none', opacity: .75 })
      .forEach(([k, v]) => l.setAttribute(k, v));
    constel.appendChild(l); lines.push(l);
    const len = Math.hypot(x2 - x1, y2 - y1); lens.push(len);
    l.style.strokeDasharray = len; l.style.strokeDashoffset = len;
  });
  Object.keys(P).filter(k => k !== 'alpha').forEach(k => {
    const [cx, cy] = pos(k), c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', k === 'beta' || k === 'delta' || k === 'eps' ? 3.4 : 2.5);
    constel.appendChild(c); dots[k] = c;
  });
  const dotList = Object.values(dots);
  gsap.set(dotList, { transformOrigin: '50% 50%', scale: 0 });

  // ---- state machine ---------------------------------------------------------
  let state = null, token = 0, scope = [], ticker = null, calm = false;
  const T = t => (scope.push(t), t);
  const ALL = [mark, ringG, wolf, ear, eye, starG, star, glow, glint, constel, ripple, reveal, ...lines, ...dotList];
  const snap = (el, step) => { const r = gsap.getProperty(el, 'rotation'); return Math.round(r / step) * step; };

  function exitState() {
    token++;
    scope.forEach(t => t.kill()); scope = [];
    if (ticker) { gsap.ticker.remove(ticker); ticker = null; }
    stopAudio();
    gsap.killTweensOf(ALL); gsap.killTweensOf([gp, gl]);
  }

  function toNeutral(d = .45) {
    const starRot = snap(star, 180);  // the star is 2-fold symmetric: finish on an equivalent angle
    return T(gsap.timeline({ defaults: { duration: d, ease: 'power2.inOut' } })
      .to(ringG, { rotation: 0, opacity: 1 }, 0)
      .to(mark, { opacity: 1 }, 0)
      .to(wolf, { rotation: 0, scale: 1, y: 0, opacity: 1 }, 0)
      .to(ear, { rotation: 0 }, 0)
      .to(eye, { scaleY: 1 }, 0)
      .to(starG, { x: 0, y: 0, scale: 1, rotation: 0, opacity: 1 }, 0)
      .to(star, { scale: 1, rotation: starRot, opacity: 1 }, 0)
      .to(glow, { opacity: 0 }, 0)
      .to([glint, constel, ripple], { opacity: 0 }, 0)
      .to(reveal, { strokeDashoffset: 0 }, 0)
      .to(gp, { a: Math.round(gp.a / 360) * 360, onUpdate: applyGrad }, 0)
      .add(() => gsap.set(star, { rotation: 0 })));
  }

  const blinkOnce = () => gsap.timeline()
    .to(eye, { scaleY: .12, duration: .07, ease: 'power2.in' })
    .to(eye, { scaleY: 1, duration: .14, ease: 'power2.out' });

  const STATES = {
    startup: {
      label: 'Startup', desc: 'At login: the crescent draws itself from its upper tip, the wolf fades up, the star ignites last with a glint. Then settles into idle.',
      run(tk) {
        const L = 2 * Math.PI * parseFloat(reveal.getAttribute('r'));
        gsap.set(reveal, { strokeDasharray: L, strokeDashoffset: L });
        gsap.set(wolf, { opacity: 0, y: 8, rotation: 0, scale: 1 });
        gsap.set(starG, { scale: 0, opacity: 0, rotation: -90, x: 0, y: 0 });
        gsap.set([glow, glint, constel, ripple], { opacity: 0 });
        gsap.set(ringG, { rotation: 0, opacity: 1 }); gsap.set(mark, { opacity: 1 }); gsap.set(eye, { scaleY: 1 }); gsap.set(ear, { rotation: 0 });
        gsap.set(star, { scale: 1, opacity: 1, rotation: 0 });
        T(gsap.timeline({ onComplete: () => tk === token && setState('idle') })
          .to(reveal, { strokeDashoffset: 0, duration: 1.4, ease: 'power2.inOut' }, 0)
          .to(wolf, { opacity: 1, y: 0, duration: .8, ease: 'power2.out' }, .55)
          .to(starG, { scale: 1, opacity: 1, rotation: 0, duration: .7, ease: 'back.out(2)' }, 1.15)
          .fromTo(glow, { opacity: 0 }, { opacity: .9, duration: .22, yoyo: true, repeat: 1 }, 1.25)
          .add(() => { gl.a = 235; applyGlint(); }, 1.5)
          .to(glint, { opacity: .5, duration: .3 }, 1.5)
          .to(gl, { a: 100, duration: 1.1, ease: 'sine.inOut', onUpdate: applyGlint }, 1.5)
          .to(glint, { opacity: 0, duration: .4 }, 2.2));
      }
    },
    idle: {
      label: 'Idle', desc: 'Irregular twinkle (not a pulse), a blink every few seconds, near-invisible breathing, and moonlight sliding down the crescent now and then. Intervals are shortened for the demo; in the dashboard use 20–40 s blinks.',
      run(tk) {
        toNeutral();
        const tw = () => { if (tk !== token || calm) return;
          T(gsap.to(star, { scale: R(.93, 1.07), rotation: R(-5, 5), opacity: R(.84, 1), duration: R(.7, 1.9), ease: 'sine.inOut', onComplete: tw })); };
        const blink = () => { if (tk !== token) return; T(blinkOnce()); T(gsap.delayedCall(R(3.5, 7), blink)); };
        const sweep = () => { if (tk !== token || calm) return;
          gl.a = 235; applyGlint();
          T(gsap.timeline()
            .to(glint, { opacity: .45, duration: .7 }, 0)
            .to(gl, { a: 105, duration: 2.6, ease: 'sine.inOut', onUpdate: applyGlint }, 0)
            .to(glint, { opacity: 0, duration: .7 }, 1.9));
          T(gsap.delayedCall(R(9, 14), sweep)); };
        T(gsap.delayedCall(.5, tw)); T(gsap.delayedCall(R(1.5, 3), blink)); T(gsap.delayedCall(3, sweep));
        if (!calm) T(gsap.to(wolf, { scale: 1.006, duration: 2.6, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: .5 }));
      }
    },
    listening: {
      label: 'Listening', desc: 'Push-to-talk held: the far ear pricks forward and the star drifts in towards the nose, glowing softly. (The ring stays put: rotating it exposes the seam where it meets the chest.)',
      run(tk) {
        toNeutral(.3);
        T(gsap.timeline({ defaults: { duration: .6, ease: 'power3.out' } })
          .to(ear, { rotation: 9 }, 0)
          .to(starG, { x: -10, y: 14, scale: .9 }, 0)
          .to(glow, { opacity: .32 }, 0));
        if (!calm) T(gsap.to(glow, { opacity: .1, duration: 1.1, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: .6 }));
      }
    },
    thinking: {
      label: 'Thinking', desc: 'Sirius draws its own constellation, Canis Major, one star at a time, then lets it fade and starts again. "Connecting the dots" instead of a spinner.',
      run(tk) {
        toNeutral(.3);
        T(gsap.to(star, { scale: .86, duration: .5, ease: 'power2.out' }));
        T(gsap.to(glow, { opacity: .22, duration: .5 }));
        const tl = gsap.timeline({ repeat: calm ? 0 : -1, repeatDelay: .35, delay: .3 });
        tl.set(constel, { opacity: 1 })
          .set(lines, { strokeDashoffset: i => lens[i] })
          .set(dotList, { scale: 0, opacity: 1 });
        EDGES.forEach(([, b], i) => {
          tl.to(lines[i], { strokeDashoffset: 0, duration: .45, ease: 'power1.inOut' }, .2 + i * .5);
          tl.to(dots[b], { scale: 1, duration: .32, ease: 'back.out(3)' }, .2 + i * .5 + .38);
        });
        tl.to(dotList, { opacity: .35, duration: .28, yoyo: true, repeat: 3, stagger: { each: .07, from: 'random' } }, '+=.15')
          .to(constel, { opacity: 0, duration: .7 }, '+=.3');
        T(tl);
      }
    },
    working: {
      label: 'Working', desc: 'Agent running tools: the shape stays still while the light moves — the gradient field rotates, a glint orbits inside the crescent, the star turns slowly.',
      run(tk) {
        toNeutral(.3);
        T(gsap.to(gp, { a: '+=360', duration: 5, ease: 'none', repeat: -1, onUpdate: applyGrad }));
        gl.a = 20; applyGlint();
        T(gsap.to(glint, { opacity: .5, duration: .5 }));
        T(gsap.to(gl, { a: '+=360', duration: 2.4, ease: 'none', repeat: -1, onUpdate: applyGlint }));
        T(gsap.to(star, { rotation: '+=180', duration: 6, ease: 'none', repeat: -1 }));
      }
    },
    speaking: {
      label: 'Speaking', desc: 'Star size and glow follow the voice envelope: fast attack (30 ms), slow release (150 ms), so it reads as speech instead of jitter. The wolf\'s mouth never moves.',
      run(tk) { toNeutral(.3); T(gsap.delayedCall(.32, () => tk === token && startSpeaking(tk))); }  // after the reset, or its overwrite kills quickTo
    },
    notify: {
      label: 'Notify', desc: 'A task finished: a short howl — the head tilts up from the neck, the star flares and sends out one ripple. Returns to idle.',
      run(tk) {
        toNeutral(.25);
        T(gsap.timeline({ onComplete: () => tk === token && setState('idle') })
          .to(wolf, { rotation: -5, duration: .5, ease: 'power2.out' }, .1)
          .to(starG, { scale: 1.5, rotation: 45, duration: .35, ease: 'back.out(2)' }, .25)
          .to(glow, { opacity: 1, duration: .25 }, .25)
          .fromTo(ripple, { attr: { r: 14 }, opacity: .9 }, { attr: { r: 96 }, opacity: 0, duration: 1.3, ease: 'power2.out' }, .3)
          .to(starG, { scale: 1, rotation: 0, duration: .7, ease: 'power2.inOut' }, .95)
          .to(glow, { opacity: 0, duration: .8 }, .95)
          .to(wolf, { rotation: 0, duration: .9, ease: 'power2.inOut' }, 1.25));
      }
    },
    error: {
      label: 'Error', desc: 'The star flickers out, sags, and relights a beat later. Noticeable, not alarming. Returns to idle.',
      run(tk) {
        toNeutral(.2);
        T(gsap.timeline({ onComplete: () => tk === token && setState('idle') })
          .to(star, { opacity: .25, duration: .05 }).to(star, { opacity: .85, duration: .05 })
          .to(star, { opacity: .1, duration: .07 }).to(star, { opacity: .6, duration: .04 })
          .to(star, { opacity: 0, duration: .12 })
          .to(starG, { y: 7, duration: .45, ease: 'power2.in' }, '<')
          .to({}, { duration: .55 })
          .set(star, { scale: .5 })
          .to(star, { opacity: 1, scale: 1, duration: .5, ease: 'back.out(2.5)' })
          .to(starG, { y: 0, duration: .5, ease: 'power2.out' }, '<')
          .fromTo(glow, { opacity: .8 }, { opacity: 0, duration: .7 }, '<'));
      }
    },
    sleep: {
      label: 'Sleep', desc: 'Inactive or late: the eye closes, the star drifts out and dims, the whole mark softens and breathes slowly.',
      run(tk) {
        toNeutral(.3);
        T(gsap.timeline({ defaults: { duration: 2.2, ease: 'power2.inOut' } })
          .to(eye, { scaleY: .12 }, 0)
          .to(starG, { x: 24, y: -22, scale: .8, opacity: .4 }, 0)
          .to(mark, { opacity: .82 }, 0));  // fade ring+wolf as one layer: no overlap band
        if (!calm) {
          T(gsap.to(wolf, { scale: 1.008, duration: 4, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: 2.2 }));
          T(gsap.to(star, { opacity: .55, duration: 2.5, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: 2.2 }));
        }
      }
    }
  };

  // ---- speaking: simulated envelope or a loaded audio file ------------------
  let actx = null, analyser = null, audioEl = null, srcNode = null, buf = null;
  function stopAudio() { if (audioEl) audioEl.pause(); }
  function startSpeaking(tk) {
    // 'scale' is an alias GSAP expands to scaleX/scaleY, so quickTo needs the real props
    const qsx = gsap.quickTo(star, 'scaleX', { duration: .08, ease: 'power2.out' });
    const qsy = gsap.quickTo(star, 'scaleY', { duration: .08, ease: 'power2.out' });
    const qs = v => { qsx(v); qsy(v); };
    const qg = gsap.quickTo(glow, 'opacity', { duration: .08, ease: 'power2.out' });
    let env = 0, target = 0, nextAt = 0;
    const useFile = analyser && audioEl && !audioEl.paused;
    ticker = (time, dtMs) => {
      const now = performance.now() / 1000, dt = Math.max(dtMs, 1) / 1000;
      let v;
      if (useFile) {
        analyser.getFloatTimeDomainData(buf);
        let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
        v = Math.min(1, Math.sqrt(s / buf.length) * 5);
        if (audioEl.ended) { setState('idle'); return; }
      } else {
        if (now > nextAt) {  // syllables of 90-220 ms, with occasional word gaps
          if (Math.random() < .18) { target = .03; nextAt = now + R(.25, .55); }
          else { target = R(.35, 1); nextAt = now + R(.09, .22); }
        }
        v = target;
      }
      const tau = v > env ? .03 : .15;
      env += (v - env) * (1 - Math.exp(-dt / tau));
      qs(1 + .42 * env); qg(.12 + .75 * env);
    };
    gsap.ticker.add(ticker);
  }
  q('audioIn').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    if (!audioEl) { audioEl = new Audio(); }
    audioEl.src = URL.createObjectURL(f);
    q('playAudio').disabled = false;
  });
  q('playAudio').addEventListener('click', async () => {
    try {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        srcNode = actx.createMediaElementSource(audioEl);
        analyser = actx.createAnalyser(); analyser.fftSize = 1024;
        buf = new Float32Array(analyser.fftSize);
        srcNode.connect(analyser); analyser.connect(actx.destination);
      }
      await actx.resume();
      audioEl.currentTime = 0;
      await audioEl.play();
      setState('speaking');
    } catch (err) {
      q('desc').textContent = 'This viewer refused audio playback; the simulated envelope still works.';
    }
  });

  // ---- UI --------------------------------------------------------------------
  const ORDER = ['startup', 'idle', 'listening', 'thinking', 'working', 'speaking', 'notify', 'error', 'sleep'];
  const statesRow = q('states');
  ORDER.forEach((k, i) => {
    const b = document.createElement('button');
    b.dataset.state = k; b.innerHTML = `${STATES[k].label}<kbd>${i + 1}</kbd>`;
    b.addEventListener('click', () => setState(k));
    statesRow.appendChild(b);
  });
  function ui() {
    statesRow.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.state === state));
    q('caption').textContent = STATES[state].label;
    q('desc').textContent = STATES[state].desc;
  }
  function setState(name) {
    exitState(); state = name; ui();
    STATES[name].run(token);
  }
  window.siriusSetState = setState;  // handy from the console
  document.addEventListener('keydown', e => {
    const i = parseInt(e.key, 10);
    if (i >= 1 && i <= ORDER.length) setState(ORDER[i - 1]);
  });

  // Per-theme wolf gradient: [top, bottom, glow]. All stops >= 3:1 against the background.
  const THEMES = {
    'Paper':         { bg:'#ebe3d1', panel:'#f4eee1', fg:'#1a1814', muted:'#5f5849', g:['#4f5a2e', '#8a5a36', '#c9b98a'] },
    'Midnight Blue': { bg:'#070d1c', panel:'#0e1730', fg:'#e6ecfa', muted:'#8b97b8', g:['#6fa0ff', '#a985ff', '#bcd2ff'] },
    'Night Owl':     { bg:'#011627', panel:'#0b2942', fg:'#d6deeb', muted:'#7e97ac', g:['#82aaff', '#7fdbca', '#c9f3ea'] },
    'Graphite':      { bg:'#16171a', panel:'#1f2125', fg:'#e8e6e1', muted:'#95918a', g:['#e8d3a2', '#c27d52', '#f6e7c4'] },
    'Sage':          { bg:'#e1e7da', panel:'#edf1e7', fg:'#1c221b', muted:'#5a6656', g:['#2f4a3a', '#5f7f52', '#b7c9a8'] },
    'Ember':         { bg:'#140e0b', panel:'#1e1510', fg:'#f0ded0', muted:'#a08b7b', g:['#ffd08a', '#f0603a', '#ffe2b0'] },
    'Orb':           { bg:'#000000', panel:'#0a0a0c', fg:'#f2f2f5', muted:'#8d8d99', g:['#6f9dff', '#e45c8c', '#c4d4ff'] },
    'Original':      { bg:'#ffffff', panel:'#f4f4f6', fg:'#1a1814', muted:'#6b6b75', g:['#6c7bbe', '#926bad', '#cfd5ff'] },
  };
  const themeRow = q('themes');
  function applyTheme(name) {
    const t = THEMES[name], r = document.body.style;
    r.setProperty('--bg', t.bg); r.setProperty('--panel', t.panel); r.setProperty('--fg', t.fg); r.setProperty('--muted', t.muted);
    q('stop0').setAttribute('stop-color', t.g[0]); q('stop1').setAttribute('stop-color', t.g[1]);
    glow.setAttribute('fill', t.g[2]);
    themeRow.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.textContent === name));
  }
  Object.keys(THEMES).forEach(name => {
    const b = document.createElement('button'); b.textContent = name;
    b.addEventListener('click', () => applyTheme(name)); themeRow.appendChild(b);
  });
  applyTheme('Paper');
  q('calmBtn').addEventListener('click', () => {
    calm = !calm; q('calmBtn').classList.toggle('on', calm); setState(state);
  });
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { calm = true; q('calmBtn').classList.add('on'); }

  setState('startup');
})();
</script>
</body>
</html>
